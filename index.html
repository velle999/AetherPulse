<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AetherPulse</title>

  <!-- 📝 Meta & SEO -->
  <meta name="description" content="AetherPulse — real-time moods from weather, markets, and world events." />
  <meta property="og:title" content="AetherPulse" />
  <meta property="og:description" content="Real-time vibes, powered by data and ambience." />
  <meta property="og:image" content="assets/fox.png" />
  <meta name="theme-color" content="#00fff0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- 🔵 Favicon & Mobile Icons -->
  <link rel="icon" type="image/png" href="assets/fox.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/fox.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/fox.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/fox.png" />

  <!-- 🧵 Stylesheet -->
  <link rel="preload" href="css/style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="css/style.css" /></noscript>

  <!-- ✨ Minimal Critical Styles to Prevent Flash -->
  <style>
    body {
      background: #000;
      color: #00fff0;
      font-family: monospace;
      margin: 0;
    }
    #mood-description.loading::after {
      content: " ⏳";
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- 🌈 Manifest -->
  <link rel="manifest" href="manifest.json" />
</head>

<body>
  <main id="aether-container" role="main">
    <!-- 🌌 Ambient Canvas -->
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>

    <!-- 🦊 Animated Companion -->
    <div id="companion" style="position: relative;">
      <div id="fox-particles" aria-hidden="true"></div>
      <picture>
        <source srcset="assets/fox@2x.png 2x, assets/fox.png 1x" type="image/png" />
        <img id="fox" src="assets/fox.png" alt="Pixel art fox companion with particle effects" />
      </picture>
    </div>

    <!-- 🌠 Mood Display -->
    <section id="mood-overlay" role="status" aria-live="polite">
      <h1 id="mood-title">AetherPulse</h1>
      <p id="mood-description" class="loading">Loading atmospheric vibe...</p>
      <div id="status">
        <span id="weather-status" title="Weather">⛅</span>
        <span id="market-status" title="Markets">📈</span>
        <span id="event-status" title="Events">🌍</span>
      </div>
    </section>

    <!-- 🌡️ Temperature Display -->
    <div id="temp-container">
      <span id="temp-value">--</span>
      <button id="temp-unit" aria-label="Toggle temperature unit">°C</button>
    </div>
  </main>

  <!-- ✅ Reveal Body After Load -->
  <script>
    window.addEventListener("load", () => {
      document.getElementById("mood-description").classList.remove("loading");
    });
  </script>

  <!-- ⚙️ Core Script Modules (deferred for performance) -->
  <script src="js/config.js" defer></script>
  <script src="js/news.js" defer></script>
  <script src="js/weather.js" defer></script>
  <script src="js/stock.js" defer></script>
  <script src="js/moodengine.js" defer></script>
  <script src="js/canvasengine.js" defer></script>
  <script src="js/audioengine.js" defer></script>
  <script src="js/app.js" defer></script>

  <!-- 🛰️ Conflict Tension Layer -->
  <script src="js/conflict.js" defer></script>
</body>
</html>
